name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Clippy (gb35114)
        run: cargo clippy --all-targets --features gb35114 -- -D warnings
      - name: Test (gb35114)
        run: cargo test --features gb35114

  msrv:
    # The rust-version field is a resolver contract for downstreams —
    # verify the crate actually builds on it (issue #5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo build

  windows-check:
    # Non-Unix targets must compile (issue #4): local-offset falls back to
    # UTC via cfg; check-only, no linking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc

  coverage:
    # Line coverage summary via cargo-llvm-cov (issue #33). Report-only for
    # now — a gate threshold is a separate decision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (default + gb35114)
        run: cargo llvm-cov --features gb35114 --summary-only
